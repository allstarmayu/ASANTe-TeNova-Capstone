version: '3'

services:
  ml_service:
    build: .
    container_name: asante_ml_service
    ports:
      - "50052:50052"
    environment:
      - DB_HOST=asante-postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=ASANTe@cu
    networks:
      - asante_network
  envoy:
    image: envoyproxy/envoy:v1.15.0
    container_name: envoy
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - ml_service
    networks:                 
      - asante_network

networks:
  asante_network:
    external: true