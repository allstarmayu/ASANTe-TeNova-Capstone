static_resources:
  listeners:
    - name: listener_grpc_web_api
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8081     # inside-container port
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_web_api
                codec_type: AUTO
                route_config:
                  name: customer_route
                  virtual_hosts:
                    - name: customer_service
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - prefix: "*"
                        allow_methods: "GET,POST,OPTIONS"
                        allow_headers: "*"
                        expose_headers: "grpc-status,grpc-message"
                        max_age: "1728000"
                      routes:
                        - match:
                            prefix: "/app.protos.CustomerService/"
                          route:
                            cluster: api_backend
                            max_grpc_timeout: 0s
                http_filters:
                  - name: envoy.filters.http.cors
                  - name: envoy.filters.http.grpc_web
                  - name: envoy.filters.http.router

  clusters:
    - name: api_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 0.25s
      http2_protocol_options: {}   # enable gRPC/HTTP2
      load_assignment:
        cluster_name: api_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: asante_api_service   # your docker‐compose service name
                      port_value: 50051

admin:
  access_log_path: "/tmp/admin_access.log"
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
